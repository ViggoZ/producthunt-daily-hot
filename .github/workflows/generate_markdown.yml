name: Generate Daily Markdown

on:
  schedule:
    - cron: '01 7 * * *'  # 每天UTC时间早上7:01（北京时间下午3:01自动运行）
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install openai>=1.0.0 python-dotenv beautifulsoup4 pytz requests
        pip list  # 显示已安装的包及其版本

    - name: Generate Markdown
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        PRODUCTHUNT_DEVELOPER_TOKEN: ${{ secrets.PRODUCTHUNT_DEVELOPER_TOKEN }}
      run: |
        python scripts/product_hunt_list_to_md.py

    - name: Commit files
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add .
        git commit -m "Generated daily content" || echo "No changes to commit"

    - name: Push changes
      run: |
        git push --force https://${{ secrets.PAT }}@github.com/${{ github.repository_owner }}/producthunt-daily-hot.git HEAD:main
    - name: Notify decohack-web
      env:
        DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      run: |
        # 通知 decohack.com 同步新一期并推送 Telegram；没配 DISPATCH_TOKEN（例如 fork）就跳过
        if [ -z "$DISPATCH_TOKEN" ]; then echo "DISPATCH_TOKEN 未配置，跳过"; exit 0; fi
        curl -sf -X POST \
          -H "Authorization: Bearer $DISPATCH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository_owner }}/decohack-web/dispatches \
          -d '{"event_type":"ph-daily-updated"}'
